name: Format README.md

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@755da8c3cf115ac066823e79a1e1788f8940201b # v3.2.0
        with:
          fetch-depth: 0

      - name: Run auto-doc
        uses: tj-actions/auto-doc@07fd015d86f1426e81ab57b73a0e04416d04e32b # v1.7.2

      - name: Run test
        uses: tj-actions/remark@10fc40701928cbafcc4a2d241679579d218144ff # v3

      - name: Verify Changed files
        uses: tj-actions/verify-changed-files@f557547e643700f439745119efed5aac390db75d # v13
        id: verify_changed_files
        with:
          files: |
            README.md

      - name: README.md changed
        if: steps.verify_changed_files.outputs.files_changed == 'true'
        run: |
          echo "README.md has uncommitted changes"
          exit 1

      - name: Create Pull Request
        if: failure()
        uses: peter-evans/create-pull-request@2b011faafdcbc9ceb11414d64d0573f37c774b04 # v4.2.3
        with:
          base: "main"
          labels: "merge when passing"
          title: "Updated README.md"
          branch: "chore/update-readme"
          commit-message: "Updated README.md"
          body: "Updated README.md"
          token: ${{ secrets.PAT_TOKEN }}

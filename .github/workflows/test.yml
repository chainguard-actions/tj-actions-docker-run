name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test docker-run
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: shellcheck
        uses: reviewdog/action-shellcheck@4c07458293ac342d477251099501a718ae5ef86e # v1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@e81a89b1732b9c48d79cd809d8d81d79c4647a18 # v2.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8c0edbc76e98fa90f69d9a2c020dcb50019dc325 # v2.2.1

      - name: Build
        uses: docker/build-push-action@1104d471370f9806843c095c1db02b5a90c5f8b6 # v3
        id: docker-build
        with:
          context: test
          load: true
          push: false
          tags: user/app:latest

      - name: Run docker-run
        uses: ./
        id: test-app-1
        with:
          name: test-app-1
          image: user/app:latest
          args: |
            bash -c 'echo "Hello World" && ls'
            
      - name: Run docker-run from a dockerhub image
        uses: ./
        id: test-app-2
        with:
          name: test-app-2
          image: ubuntu:latest
          args: |
            bash -c 'echo "Hello World" && ls'
            
      - name: Show output
        env:
          TEST_APP_1_OUTPUTS: ${{ toJSON(steps.test-app-1.outputs) }}
          TEST_APP_2_OUTPUTS: ${{ toJSON(steps.test-app-2.outputs) }}
        run: |
          echo "$TEST_APP_1_OUTPUTS"
          echo "$TEST_APP_2_OUTPUTS"
        shell:
          bash

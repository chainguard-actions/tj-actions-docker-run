name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test docker-run
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: shellcheck
        uses: reviewdog/action-shellcheck@4c07458293ac342d477251099501a718ae5ef86e # v1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@2b82ce82d56a2a04d2637cd93a637ae1b359c0a7 # v2.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@16c0bc4a6e6ada2cfd8afd41d22d95379cf7c32a # v2.8.0

      - name: Build
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
        id: docker-build
        with:
          context: test
          load: true
          push: false
          tags: user/app:latest

      - name: Run docker-run
        uses: ./
        id: test-app-1
        with:
          name: test-app-1
          image: user/app:latest
          args: |
            bash -c 'echo "Hello World" && ls'
            
      - name: Run docker-run from a dockerhub image
        uses: ./
        id: test-app-2
        with:
          name: test-app-2
          image: ubuntu:latest
          args: |
            bash -c 'echo "Hello World" && ls'
            
      - name: Show output
        env:
          TEST_APP_1_OUTPUTS: ${{ toJSON(steps.test-app-1.outputs) }}
          TEST_APP_2_OUTPUTS: ${{ toJSON(steps.test-app-2.outputs) }}
        run: |
          echo "$TEST_APP_1_OUTPUTS"
          echo "$TEST_APP_2_OUTPUTS"
        shell: bash

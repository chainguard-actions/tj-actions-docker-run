name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test docker-run-action
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: shellcheck
        uses: reviewdog/action-shellcheck@4c07458293ac342d477251099501a718ae5ef86e # v1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@e81a89b1732b9c48d79cd809d8d81d79c4647a18 # v2.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8c0edbc76e98fa90f69d9a2c020dcb50019dc325 # v2.2.1

      - name: Build
        uses: docker/build-push-action@1104d471370f9806843c095c1db02b5a90c5f8b6 # v3
        id: docker-build
        with:
          context: .
          load: true
          push: false
          tags: user/app:latest

      - name: Run docker-run-action
        uses: ./
        with:
          image: user/app:latest
          args: |
            echo "Hello World" && ls
            
      - name: Run docker-run-action from a dockerhub image
        uses: ./
        with:
          image: ubuntu:latest
          args: |
            echo "Hello World" && ls

name: Test command failure propagation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run docker action with a failing command
        id: action
        uses: .
        with:
          image: alpine:3.18
          args: sh -c "exit 1"
        continue-on-error: true
      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly propagated container exit code"

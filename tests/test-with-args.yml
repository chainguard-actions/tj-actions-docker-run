name: Test docker run with args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean up any existing container
        run: |
          docker rm -f test-args-container 2>/dev/null || true
      - id: action
        uses: .
        with:
          image: alpine:latest
          name: test-args-container
          args: echo hello-from-docker
      - name: Assert container-id is non-empty
        env:
          CONTAINER_ID: ${{ steps.action.outputs.container-id }}
        run: |
          echo "container-id: $CONTAINER_ID"
          if [ -z "$CONTAINER_ID" ]; then
            echo "FAIL: expected a non-empty container-id"
            exit 1
          fi
          echo "PASS: container-id=$CONTAINER_ID"
      - name: Assert container ran the expected command
        run: |
          LOGS=$(docker logs test-args-container 2>&1)
          echo "container logs: $LOGS"
          if ! echo "$LOGS" | grep -q "hello-from-docker"; then
            echo "FAIL: expected 'hello-from-docker' in container logs"
            exit 1
          fi
          echo "PASS: found expected output in container logs"
      - name: Clean up container
        if: always()
        run: |
          docker rm -f test-args-container 2>/dev/null || true

name: Test basic docker run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          image: alpine:latest
          name: test-basic-container
          args: echo hello
      - name: Assert container-id is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.container-id }}
        run: |
          echo "actual container-id: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected a non-empty container-id"
            exit 1
          fi
          echo "PASS: container-id=$ACTUAL"

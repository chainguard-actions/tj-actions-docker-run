name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run docker action with basic echo command
        id: action
        uses: .
        with:
          image: alpine:3.18
          args: echo hello-from-docker
      - name: Assert action completed successfully
        run: |
          echo "PASS: docker run completed without error"

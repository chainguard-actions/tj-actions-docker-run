name: Test with docker run options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run docker action with environment variable option
        id: action
        uses: .
        with:
          image: alpine:3.18
          args: sh -c "echo $MY_VAR"
          options: -e MY_VAR=hello-from-env
      - name: Assert action completed successfully
        run: |
          echo "PASS: docker run with options completed without error"
